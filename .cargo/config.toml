[alias]
xtask = "run -p xtask --"

# Tuned for the machine that builds it (this fork targets one Ivy Bridge iMac on Catalina):
# use every instruction set the build CPU has (AVX, SSE4.2, F16C), not the x86-64 baseline.
# The result only runs on CPUs like the one that built it.
[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]
